# Keep notifications below Amane's 30px top bar and its 3px inset.
anchor=top-right
layer=overlay
outer-margin=44,16,0,0
margin=6
padding=10
width=360
height=120
border-size=1
border-radius=10
background-color=#260b0fd9
text-color=#f5e1e4
border-color=#c4234596
progress-color=over #f04462
default-timeout=5000
max-visible=4
max-history=10
history=1
icons=1
max-icon-size=32
markup=1
actions=1
format=<b>%s</b>\n%b

[urgency=high]
border-color=#ff8094
default-timeout=0
