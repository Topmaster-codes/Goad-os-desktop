name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libfontconfig1-dev \
            libpam0g-dev \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dependencies and compile
        run: cargo check --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release binary
        run: |
          cargo build --release
          test -x target/release/amane-shell

  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh bundle.sh
      - name: Check Python syntax
        run: python3 -m py_compile scripts/audio-applications
