# Keep notifications below Amane's 30px top bar and its 3px inset.
anchor=top-right
layer=overlay
outer-margin=44,16,0,0
margin=6
padding=10
width=360
height=120
border-size=1
border-radius=10
background-color=#0a2830d9
text-color=#d8edf1
border-color=#1e7a9896
progress-color=over #1e7a98
default-timeout=5000
max-visible=4
max-history=10
history=1
icons=1
max-icon-size=32
markup=1
actions=1
format=<b>%s</b>\n%b

[urgency=high]
border-color=#e58b74
default-timeout=0
