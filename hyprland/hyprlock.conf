# Deep Current lock screen

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.90
    brightness = 0.78
    vibrancy = 0.16
    vibrancy_darkness = 0.10
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(220, 241, 245, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  /  %d %B %Y"
    color = rgba(132, 177, 188, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(30, 122, 152, 0.92)
    inner_color = rgba(10, 40, 50, 0.86)
    font_color = rgba(220, 241, 245, 1.0)
    check_color = rgba(98, 183, 201, 1.0)
    fail_color = rgba(220, 105, 115, 1.0)
    placeholder_text = <i>enter passphrase</i>
    hide_input = false
    rounding = 18
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}
