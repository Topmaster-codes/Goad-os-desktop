[package]
name = "amane-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "amane-shell"
path = "src/main.rs"

[dependencies]
amane = { path = "vendor/amane" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
incremental = false

[workspace]
